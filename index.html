<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>MTB PINBALL — Neon Downhill</title><style>html,body{margin:0;background:#080c1d;color:white;font-family:system-ui;overflow:hidden}canvas{display:block}#hud{position:absolute;top:12px;left:16px;pointer-events:none;text-shadow:0 2px 8px #000}h1{margin:0;color:#6cfaff;letter-spacing:3px;font-size:clamp(18px,3vw,30px)}#score{font-size:24px;font-weight:800;color:#ffe66d}#info{font-size:13px;color:#d5e5fa}#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#080c1dcc;padding:9px 14px;border:1px solid #4adcf5;border-radius:12px;text-align:center;font-size:13px;white-space:nowrap}#buttons{position:absolute;bottom:58px;width:100%;display:flex;justify-content:space-between;pointer-events:none}button{pointer-events:auto;background:#0c2448dd;border:2px solid #5cf5ff;color:white;border-radius:16px;padding:16px 22px;font-weight:800;touch-action:none}#left{margin-left:12px}#right{margin-right:12px}#launch{position:absolute;right:12px;top:18px;background:#ef4f9a}#message{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(20px,4vw,42px);color:#ffde64;text-shadow:0 0 20px #ff459c;pointer-events:none;text-align:center}@media (pointer:coarse){#help{display:none}#hud{top:calc(env(safe-area-inset-top) + 8px);left:12px}h1{font-size:15px;letter-spacing:1px}#score{font-size:21px}#info{font-size:11px}#buttons{bottom:calc(env(safe-area-inset-bottom) + 12px);padding:0 8px;box-sizing:border-box}#buttons button{min-width:39vw;min-height:76px;font-size:15px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}#left{margin-left:0}#right{margin-right:0}#launch{top:calc(env(safe-area-inset-top) + 12px);right:10px;padding:13px 16px;min-height:50px;font-size:13px}#message{top:32%;width:80%;font-size:22px}}html,body{height:100%;overscrol import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090c1c);scene.fog=new THREE.Fog(0x090c1c,22,55);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,-13,19);camera.lookAt(0,1,0);const mobile=matchMedia('(pointer:coarse)').matches;const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:mobile?'low-power':'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:2));renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0x86baff,0x100a24,2));const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(-5,-4,12);scene.add(light);
const mats={floor:new THREE.MeshStandardMaterial({color:0x142b42,roughness:.5,metalness:.2}),wall:new THREE.MeshStandardMaterial({color:0x26354e,metalness:.65,roughness:.3}),pink:new THREE.MeshStandardMaterial({color:0xff389a,emissive:0x8a1249,emissiveIntensity:1.1,metalness:.3}),cyan:new THREE.MeshStandardMaterial({color:0x39e8ff,emissive:0x086c86,emissiveIntensity:1.1}),gold:new THREE.MeshStandardMaterial({color:0xffd447,emissive:0x9b5500,emissiveIntensity:.6}),green:new THREE.MeshStandardMaterial({color:0x3eff8d,emissive:0x087743}),rock:new THREE.MeshStandardMaterial({color:0x47526c,flatShading:true}),ball:new THREE.MeshStandardMaterial({color:0xf8ffff,metalness:.95,roughness:.1})};
function mesh(g,m,x=0,y=0,z=0){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o}function box(w,h,d,m,x,y,z){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z)}function line(points,color,r=.035){let curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));return mesh(new THREE.TubeGeometry(curve,Math.max(12,points.length*8),r,7,false),color)}function text(s,x,y,z,size=.35,color='#ffffff'){let c=document.createElement('canvas');c.width=512;c.height=128;let ctx=c.getContext('2d');ctx.fillStyle=color;ctx.font='bold 55px system-ui';ctx.textAlign='center';ctx.fillText(s,256,77);let t=new THREE.CanvasTexture(c);let o=mesh(new THREE.PlaneGeometry(size*4,size),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}),x,y,z);return o}
box(8.2,15.2,.35,mats.floor,0,0,-.25);box(.24,15.3,.8,mats.wall,-4.13,0,.2);box(.24,15.3,.8,mats.wall,4.13,0,.2);box(8.4,.25,.8,mats.wall,0,7.55,.2);for(let s of [-1,1]){line([[s*3.95,-6.5,.4],[s*3.7,-5,.45],[s*3.9,-2,.45],[s*3.9,4,.45],[s*3.6,7,.45]],mats.cyan,.06);line([[s*3.5,-6.5,.15],[s*2.1,-4.7,.15],[s*2.0,-4,.15]],mats.pink,.08)}
// Elevated trails and rails
for(let s of [-1,1]){let pts=[[s*2.8,6.6,.8],[s*3.1,4.7,1.3],[s*2.5,2.5,1.65],[s*3.1,.4,1.1],[s*2.1,-1.2,.55]];line(pts,mats.gold,.17);line(pts.map(p=>[p[0]-.18,p[1],p[2]+.18]),mats.cyan,.045);line(pts.map(p=>[p[0]+.18,p[1],p[2]+.18]),mats.cyan,.045)}line([[-1.6,5.5,.4],[-1.1,4.5,1.1],[0,3.8,1.6],[1.1,4.5,1.1],[1.6,5.5,.4]],mats.pink,.14);
const bumpers=[[-2,2.5], [0,3.6],[2,2.5],[-1.5,.3],[1.5,.3]];for(let [x,y] of bumpers){mesh(new THREE.CylinderGeometry(.56,.62,.26,24),mats.pink,x,y,.24);mesh(new THREE.TorusGeometry(.53,.07,8,30),mats.cyan,x,y,.41);mesh(new THREE.CylinderGeometry(.32,.4,.35,8),mats.rock,x,y,.55)}
for(let i=0;i<7;i++){let x=(i%2?1:-1)*(3.25-(i%3)*.22),y=5.8-i*1.55;mesh(new THREE.ConeGeometry(.36,.85,6),mats.green,x,y,.55);mesh(new THREE.CylinderGeometry(.08,.08,.4,6),mats.wall,x,y,.15)}for(let i=0;i<9;i++){let x=-3.2+(i%5)*1.6,y=6.7-Math.floor(i/5)*.6;mesh(new THREE.IcosahedronGeometry(.22+i%3*.07,0),mats.rock,x,y,.28)}
text('DOWNHILL',0,6.7,.13,.65,'#75faff');text('JUMP',0,4.7,.15,.5,'#ffcc66');text('TRAIL',-2.2,-2,.15,.5,'#8bffb0');text('RACE',2.2,-2,.15,.5,'#ff83cc');
const flippers=[];for(let s of [-1,1]){let pivot=new THREE.Group();pivot.position.set(s*1.5,-5.85,.28);scene.add(pivot);let body=box(1.8,.28,.28,s===-1?mats.cyan:mats.pink,0,0,0);scene.remove(body);pivot.add(body);body.position.x=-s*.83;body.geometry.translate(0,0,0);flippers.push({pivot,s,active:false})}const ball=mesh(new THREE.SphereGeometry(.19,24,16),mats.ball,3.4,-6.6,.32);let state={x:3.4,y:-6.6,vx:0,vy:0,live:false,balls:3,score:0,combo:1,lastHit:0};const msg=document.getElementById('message');function message(t){msg.textContent=t;clearTimeout(message.timer);message.timer=setTimeout(()=>msg.textContent='',1300)}function launch(){if(state.live||state.balls<=0)return;state.x=3.4;state.y=-6.6;state.vx=-2.5-Math.random();state.vy=12.5;state.live=true;message('RIDE ON!')}function reset(){state={x:3.4,y:-6.6,vx:0,vy:0,live:false,balls:3,score:0,combo:1,lastHit:0};update();message('NOUVELLE COURSE')}function update(){document.getElementById('score').textContent=String(state.score).padStart(6,'0');document.getElementById('balls').textContent=state.balls;document.getElementById('combo').textContent='x'+state.combo}function score(n){state.combo=performance.now()-state.lastHit<2800?Math.min(8,state.combo+1):1;state.lastHit=performance.now();state.score+=n*state.combo;update()}function drain(){state.live=false;state.balls--;state.combo=1;update();if(state.balls<=0)message('GAME OVER · R POUR REJOUER');else message('BILLE PERDUE · LANCER')}
function collisionCircle(cx,cy,r,power=1){let dx=state.x-cx,dy=state.y-cy,d=Math.hypot(dx,dy);if(d<r+.19&&d>.001){let nx=dx/d,ny=dy/d;state.x=cx+nx*(r+.2);state.y=cy+ny*(r+.2);let dot=state.vx*nx+state.vy*ny;state.vx-=2*dot*nx;state.vy-=2*dot*ny;state.vx+=nx*power;state.vy+=ny*power;score(100);return true}return false}
function segment(ax,ay,bx,by,r=.16,boost=0){let dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((state.x-ax)*dx+(state.y-ay)*dy)/(dx*dx+dy*dy)));let px=ax+t*dx,py=ay+t*dy;let ex=state.x-px,ey=state.y-py,d=Math.hypot(ex,ey);if(d<r+.19&&d>.0001){let nx=ex/d,ny=ey/d;state.x=px+nx*(r+.2);state.y=py+ny*(r+.2);let dot=state.vx*nx+state.vy*ny;if(dot<0){state.vx-=1.65*dot*nx;state.vy-=1.65*dot*ny}state.vx+=nx*boost;state.vy+=ny*boost;return true}return false}
function physics(dt){if(!state.live)return;let steps=3;for(let k=0;k<steps;k++){let h=dt/steps;state.vy-=5.7*h;state.vx*=1-.10*h;state.vy*=1-.10*h;state.x+=state.vx*h;state.y+=state.vy*h;if(state.x<-3.76){state.x=-3.76;state.vx=Math.abs(state.vx)*.82}if(state.x>3.76){state.x=3.76;state.vx=-Math.abs(state.vx)*.82}if(state.y>7.22){state.y=7.22;state.vy=-Math.abs(state.vy)*.84}for(let [x,y] of bumpers)collisionCircle(x,y,.56,3.6);segment(-3.5,-6.4,-2.05,-4.6,.17,1.1);segment(3.5,-6.4,2.05,-4.6,.17,1.1);for(let f of flippers){let a=f.pivot.rotation.z;let x=f.s*1.5,y=-5.85;let tipx=x+(-f.s)*1.68*Math.cos(a),tipy=y+(-f.s)*1.68*Math.sin(a);if(segment(x,y,tipx,tipy,.22,f.active?8.5:1)&&f.active){state.vy=Math.max(state.vy,8.8);state.vx+=-f.s*1.5;score(25)}}if(state.y<-7.5){drain();break}let speed=Math.hypot(state.vx,state.vy);if(speed>19){state.vx*=19/speed;state.vy*=19/speed}}ball.position.set(state.x,state.y,.35)}
const keys={};function setKey(k,v){keys[k]=v}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();setKey(e.code,true);if(e.code==='Space')launch();if(e.code==='KeyR')reset()});addEventListener('keyup',e=>setKey(e.code,false));for(let [id,code] of [['left','ArrowLeft'],['right','ArrowRight']]){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();setKey(code,true);b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>setKey(code,false))}document.getElementById('launch').addEventListener('pointerdown',e=>{e.preventDefault();launch()});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.ArrowLeft=false;keys.ArrowRight=false;keys.KeyA=false;keys.KeyD=false}});let clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.033);for(let f of flippers){f.active=!!(keys[f.s<0?'ArrowLeft':'ArrowRight']||keys[f.s<0?'KeyA':'KeyD']);let target=f.active?f.s*.65:0;f.pivot.rotation.z+=(target-f.pivot.rotation.z)*Math.min(1,dt*23)}physics(dt);renderer.render(scene,camera)}frame();function fitCamera(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;const portrait=w/h<.8;camera.fov=portrait?54:42;camera.position.set(0,portrait?-12.5:-13,portrait?27:19);camera.lookAt(0,portrait?0:1,0);camera.updateProjectionMatrix();renderer.setSize(w,h);renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:2))}addEventListener('resize',fitCamera);addEventListener('orientationchange',()=>requestAnimationFrame(fitCamera));fitCamera();update();
